name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: XlsxSearcher-macos
            exe_name: XlsxSearcher
          - os: windows-latest
            artifact_name: XlsxSearcher-windows
            exe_name: XlsxSearcher.exe
          - os: ubuntu-latest
            artifact_name: XlsxSearcher-linux
            exe_name: XlsxSearcher

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build Web UI
        shell: bash
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Linux WebKit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            SEP=";"
            ICON_FILE="icons/app_icon.ico"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            SEP=":"
            ICON_FILE="icons/app_icon.png"
          else
            SEP=":"
            ICON_FILE="icons/app_icon.png"
          fi
          pyinstaller --onefile --windowed --name ${{ matrix.exe_name }} \
            --icon "$ICON_FILE" \
            --add-data "icons/app_icon.png${SEP}icons" \
            --add-data "webui/dist${SEP}webui/dist" \
            --add-data "app.yml${SEP}." \
            --collect-all webview \
            main.py

      - name: Create artifact
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path ${{ matrix.exe_name }} -DestinationPath ${{ matrix.artifact_name }}.zip -Force"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS .app is a directory bundle — must use -r and NOT use -j
            zip -ry ${{ matrix.artifact_name }}.zip ${{ matrix.exe_name }}.app
          else
            # Linux single binary
            zip -j ${{ matrix.artifact_name }}.zip ${{ matrix.exe_name }}
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.zip
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog
        id: changelog
        run: |
          # 提取 CHANGELOG.md 中最新一个版本的内容
          # 从第一个 "## [x.y.z]" 开始，到下一个 "## [x.y.z]"（或文件末尾）结束
          awk '
            /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {
              if (!started) { started=1; next }
              exit
            }
            started { print }
          ' CHANGELOG.md > /tmp/release_body.md
          echo "lines=$(wc -l < /tmp/release_body.md)"
          cat /tmp/release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: /tmp/release_body.md
          files: |
            artifacts/XlsxSearcher-macos/*.zip
            artifacts/XlsxSearcher-windows/*.zip
            artifacts/XlsxSearcher-linux/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
