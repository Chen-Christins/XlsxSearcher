name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: XlsxSearcher-macos
            bundles: app,dmg
            tauri_target: universal-apple-darwin
          - os: windows-latest
            artifact_name: XlsxSearcher-windows
            bundles: nsis
          - os: ubuntu-latest
            artifact_name: XlsxSearcher-linux
            bundles: deb,appimage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix webui ci

      - name: Build Web UI
        shell: bash
        working-directory: webui
        run: npm run build

      - name: Install Linux WebKit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libxdo-dev libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build Tauri App
        shell: bash
        run: |
          npm run tauri -- build --bundles "${{ matrix.bundles }}" \
            ${{ matrix.tauri_target != '' && format('--target {0}', matrix.tauri_target) || '' }}

      - name: Create artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe dist/
            powershell -Command "Compress-Archive -Path 'dist/*' -DestinationPath '${{ matrix.artifact_name }}.zip' -Force"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
            cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app dist/
            # .app is a directory bundle — must use -r and NOT use -j
            (cd dist && zip -ry "../${{ matrix.artifact_name }}.zip" .)
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/deb/*.deb dist/ 2>/dev/null || true
            zip -j ${{ matrix.artifact_name }}.zip dist/*
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog
        id: changelog
        run: |
          # 提取 CHANGELOG.md 中最新一个版本的内容
          # 从第一个 "## [x.y.z]" 开始，到下一个 "## [x.y.z]"（或文件末尾）结束
          awk '
            /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {
              if (!started) { started=1; next }
              exit
            }
            started { print }
          ' CHANGELOG.md > /tmp/release_body.md
          echo "lines=$(wc -l < /tmp/release_body.md)"
          cat /tmp/release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: /tmp/release_body.md
          files: |
            artifacts/XlsxSearcher-macos/*.zip
            artifacts/XlsxSearcher-windows/*.zip
            artifacts/XlsxSearcher-linux/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
